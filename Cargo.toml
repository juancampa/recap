[package]
name = "recap"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "recap"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
similar = "2"
anyhow = "1"
percent-encoding = "2"
sha2 = "0.10"
nucleo-matcher = "0.3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
dirs = "6"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ureq = { version = "2", default-features = false, features = ["json"] }
