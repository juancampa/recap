[package]
name = "slicer"
version = "0.1.0"
edition = "2024"
description = "Plan and stage a series of commits from the pending changes of a git repository, with the hunk attribution of the recap server."

[[bin]]
name = "slicer"
path = "src/main.rs"

[dependencies]
recap-api.workspace = true
recap-client.workspace = true
recap-unidiff.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
regex.workspace = true
